*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#191f28;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main,header{max-width:560px;margin:auto;padding:16px}header{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #e5e8eb}h1{font-size:22px;margin:0 0 12px}h2{font-size:17px;margin:0 0 14px}small{color:#687583}section{background:white;border:1px solid #e5e8eb;border-radius:16px;padding:16px;margin-bottom:12px}input,select,button,textarea{font:inherit;border:1px solid #dce1e6;border-radius:10px;padding:12px;width:100%;min-width:0;background:white;color:inherit}button{cursor:pointer;font-weight:700;background:#3182f6;color:white;border:0}button.secondary{background:#eef2f6;color:#344054}nav,.row{display:flex;gap:8px;margin:8px 0}nav button{font-size:13px;padding:12px 3px;background:#eef2f6;color:#687583}nav button.active{background:#191f28;color:white}label{display:block;font-size:12px;color:#687583;margin:10px 0 4px}.item{border-bottom:1px solid #eee;padding:12px 0;line-height:1.6}.item:last-child{border:0}.actions{display:flex;gap:8px;margin-top:8px}.actions button{width:auto;padding:6px 12px;font-size:12px}.red{color:#d92d45}.blue{color:#3182f6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px;border-radius:10px;font:13px/1.7 inherit;font-family:inherit}#login{max-width:400px;margin:15vh auto;padding:24px}#login input{margin:16px 0;text-align:center;letter-spacing:8px}img{max-width:100%;max-height:180px;border-radius:8px} [hidden]{display:none!important}#status{font-size:12px;color:#687583;margin-top:8px}
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --accent: #3182f6;
      --accent-soft: #e8f3ff;
      --border: #e5e8eb;
      --danger: #f04452;
      --ok: #0ca678;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .app { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg); padding-bottom: 84px; }
    header { background: var(--card); padding: 16px 18px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .badge { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 4px 8px; border-radius: 999px; font-weight: 700; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .tab { border: 0; background: #f2f4f6; color: var(--sub); padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .tab.active { background: var(--text); color: #fff; }
    main { padding: 14px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
    .card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #fff; }
    .btn { width: 100%; border: 0; background: var(--accent); color: #fff; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn.sub { background: #f2f4f6; color: var(--text); }
    .btn.ok { background: var(--ok); }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f4f6; font-size: 14px; }
    .item:last-child { border-bottom: 0; }
    .muted { color: var(--sub); font-size: 12px; }
    .price { font-weight: 800; text-align: right; }
    .pill { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.low { background: #ffe8ea; color: var(--danger); }
    .pill.ok { background: #e6fcf5; color: var(--ok); }
    .preview { background: #fff9db; border: 1px solid #ffe066; border-radius: 12px; padding: 12px; font-size: 13px; white-space: pre-line; line-height: 1.5; margin-bottom: 10px; }
    .hidden { display: none; }
    .pin-screen { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; max-width: 430px; margin: 0 auto; }
    .pin-box { width: 100%; text-align: center; }
    .pin-input { text-align: center; font-size: 24px; letter-spacing: 10px; font-weight: 800; margin: 16px 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #191f28; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200; }
    .toast.show { opacity: 1; }

</style><body><div id="login"><h1>서울바당 운영노트</h1><small>직원 전용 · 공용 서버</small><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN"><button onclick="login()">입장하기</button></div><div id="app" hidden><header><h1>서울바당 운영노트 <span class="badge">V2.7</span></h1><div class="row"><select id="store"><option>뚝섬점</option><option>혜화점</option></select><input id="day" type="date"></div><nav id="nav"></nav><div id="status"></div><div class="row"><button class="secondary" onclick="refreshNow()">새로고침</button><button class="secondary" onclick="cancelDraft()">입력 취소</button></div></header><main><section><h2 id="heading"></h2><form id="form"></form></section><section><h2 id="summary"></h2><div id="items"></div></section><section id="rulePanel" hidden></section><section id="payrollPanel" hidden></section><section><h2>카톡 공유용</h2><pre id="preview"></pre><button onclick="copy()">텍스트 복사</button></section><section><button id="backup" class="secondary" onclick="backup()">전체 데이터 백업 (JSON)</button><button class="secondary" style="margin-top:12px" onclick="logout()">로그아웃</button></section></main></div><script>
const $=id=>document.getElementById(id), money=n=>Math.round(n).toLocaleString('ko-KR')+'원', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db={},role='',tab='order',edit=-1;let now=new Date();$('day').value=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);const tabs={order:'발주/단가',resv:'예약',stock:'마감재고',shift:'근무표',closing:'마감장부'};const fields={order:[['name','품목명'],['vendor','거래처'],['kg','입고 중량(kg)','number'],['qty','총 수량 (선택)','number'],['unit','수량 단위','select','마리,개,팩,봉'],['total','총 입고가(원)','number'],['photo','영수증 사진 (선택)','file']],resv:[['time','예약 시간','time'],['name','예약자'],['people','인원','number'],['note','요청사항'],['state','상태','select','확정,대기,취소']],stock:[['name','품목명'],['vendor','거래처'],['qty','현재 재고','number'],['target','목표 재고','number'],['unit','단위','select','마리,개,kg,g,팩,봉,통'],['note','비고'],['photo','재고 사진 (선택)','file']],shift:[['name','직원명'],['start','출근','time'],['end','퇴근','time'],['note','비고']]};const key=()=>JSON.stringify([$('store').value,$('day').value,tab]);const records=()=>db[key()]||[];async function api(path,method='GET',body){const res=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let x=await res.json().catch(()=>({}));if(!res.ok)throw Error(x.error||'요청 실패');return x}const scope=()=>new URLSearchParams({store:$('store').value,day:$('day').value,tab}).toString();async function login(){try{let x=await api('login','POST',{pin:$('pin').value});enter(x.role)}catch(e){alert(e.message)}}function enter(r){role=r;$('login').hidden=true;$('app').hidden=false;$('backup').hidden=role!=='관리자';render()}async function logout(){if(!canLeave())return;try{await api('logout','POST',{});location.reload()}catch(e){alert(e.message)}}let seq=0;async function render(){dirty=false;edit=-1;activeStore=$('store').value;activeDay=$('day').value;let n=++seq,k=key();$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="switchTab('${k}')">${v}</button>`).join('');$('status').textContent='불러오는 중';$('form').innerHTML='';$('items').innerHTML='';$('payrollPanel').hidden=true;$('payrollPanel').innerHTML='';$('rulePanel').hidden=true;$('rulePanel').innerHTML='';$('preview').textContent='';try{let rows=await api('records?'+scope());if(n!==seq)return;db[k]=rows;if(tab==='closing'||tab==='shift'){await extraRender(n);return;}$('status').textContent=role+' · 서버 저장';$('form').oninput=null;$('form').onchange=null;drawForm();drawList()}catch(e){if(n===seq)$('status').textContent=e.message}}function drawForm(){let r=records()[edit]||{};$('heading').textContent=tabs[tab]+(edit<0?' 등록':' 수정');if(tab==='shift'&&role!=='관리자'){$('form').innerHTML='<small>근무표는 관리자만 등록 및 수정할 수 있습니다.</small>';return}$('form').innerHTML=fields[tab].map(([k,l,t='text',opts])=>`<label for="f_${k}">${l}</label>`+(t==='select'?`<select id="f_${k}" name="${k}">${opts.split(',').map(o=>`<option ${r[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${k}" name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} ${t==='file'?'accept="image/*"':`value="${esc(r[k])}"`} ${['name','total','people','time','start','end','target'].includes(k)||(k==='qty'&&tab==='stock')?'required':''}>`)).join('')+`<button style="margin-top:16px" type="submit">${edit<0?'저장하기':'수정 저장'}</button>`;}
function line(r){if(tab==='order'){let a=[];if(+r.kg>0)a.push('kg당 '+money(r.total/r.kg),'100g당 '+money(r.total/r.kg/10));if(+r.qty>0)a.push(r.unit+'당 '+money(r.total/r.qty));let base=+r.qty>0?r.total/r.qty:r.total/r.kg/10;return `${r.name} ${r.kg?r.kg+'kg ':''}${r.qty?r.qty+r.unit:''} / ${money(+r.total)}\n${a.join(' · ')}\n판매가 참고(마리/개 등 수량 단위 또는 100g 기준): ×3 ${money(base*3)} / ×4 ${money(base*4)}`};if(tab==='resv')return `${r.time} ${r.name} (${r.people}명) · ${r.state}${r.note?' / '+r.note:''}`;if(tab==='stock')return `${r.name}: ${r.qty}${r.unit} / 목표 ${r.target}${r.unit} · ${+r.qty<+r.target?'발주 '+(+r.target-+r.qty)+r.unit:'충분'} ${r.note||''}`;return `${r.name} ${r.start}~${r.end} ${r.note||''}`}
function drawList(){let rs=records(), sorted=rs.map((r,i)=>({r,i}));if(tab==='resv')sorted.sort((a,b)=>a.r.time.localeCompare(b.r.time));$('summary').textContent=tab==='order'?'입고 합계 '+money(rs.reduce((s,r)=>s+ +r.total,0)):tab==='resv'?`예약 ${rs.filter(r=>r.state!=='취소').length}팀 · ${rs.filter(r=>r.state!=='취소').reduce((s,r)=>s+ +r.people,0)}명`:tab==='stock'?`재고 ${rs.length}종 · 발주 필요 ${rs.filter(r=>+r.qty<+r.target).length}종`:`근무 ${rs.length}건`;$('items').innerHTML=sorted.map(({r,i})=>`<div class="item"><small>${esc(r.vendor||'')}</small><div style="white-space:pre-line" class="${tab==='stock'&&+r.qty<+r.target?'red':''}">${esc(line(r))}</div>${r.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)?`<img src="${esc(r.photo)}">`:''}${tab!=='shift'||role==='관리자'?`<div class="actions"><button class="secondary" onclick="startEdit(${i})">수정</button><button class="secondary" onclick="remove(${i})">삭제</button></div>`:''}</div>`).join('')||'<small>등록된 기록이 없습니다.</small>';let lines=[];if(['order','stock'].includes(tab)){let groups=new Map;for(let {r} of sorted){let v=r.vendor||'거래처 미지정';if(!groups.has(v))groups.set(v,[]);groups.get(v).push(r)}for(let [v,rr] of groups){lines.push('\n['+v+']',...rr.map(line))}}else lines=sorted.map(({r})=>line(r));$('preview').textContent=`[서울바당 ${$('store').value} ${$('day').value} ${tabs[tab]}]\n${lines.join('\n')}\n${$('summary').textContent}`}
$('form').onsubmit=async e=>{e.preventDefault();let q=scope(),old=records()[edit],r=Object.fromEntries(new FormData(e.target)),file=r.photo;delete r.photo;if(busy)return;busy=true;let btn=e.submitter;btn.disabled=true;try{if(file&&file.size){let b=await createImageBitmap(file),c=document.createElement('canvas'),z=Math.min(1,1000/Math.max(b.width,b.height));c.width=b.width*z;c.height=b.height*z;c.getContext('2d').drawImage(b,0,0,c.width,c.height);r.photo=c.toDataURL('image/jpeg',.65);b.close()}else if(old?.photo)r.photo=old.photo;if(old)r.version=old.version;await api('records'+(old?'/'+old.id:'')+'?'+q,old?'PUT':'POST',r);await render()}catch(e){alert(e.message)}finally{btn.disabled=false;busy=false}};async function remove(i){if(busy||dirty||edit>=0){alert('작성 중인 내용을 먼저 저장하거나 취소하세요.');return}if(!confirm('삭제할까요?'))return;let r=records()[i];busy=true;try{await api('records/'+r.id+'?'+scope(),'DELETE',{version:r.version});await render()}catch(e){alert(e.message)}finally{busy=false}}$('store').onchange=$('day').onchange=changeScope;async function copy(){let t=$('preview').textContent;try{await navigator.clipboard.writeText(t);alert('복사 완료')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();if(ok)alert('복사 완료');else prompt('아래 내용을 직접 복사하세요',t)}}async function backup(){try{let rows=await api('backup-full'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows)],{type:'application/json'}));a.download='seoulbadang-full-'+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}}api('session').then(x=>enter(x.role)).catch(()=>{});let dirty=false,busy=false,activeStore=$('store').value,activeDay=$('day').value;
function canLeave(){return !busy&&!extraBusy&&(!(dirty||edit>=0)||confirm('저장하지 않은 내용이 사라집니다. 이동할까요?'))}
function switchTab(t){if(t===tab||!canLeave())return;tab=t;render()}
function changeScope(){if(!canLeave()){$('store').value=activeStore;$('day').value=activeDay;return}render()}
function startEdit(i){if(!canLeave())return;dirty=false;edit=i;drawForm();window.scrollTo(0,0)}
function cancelDraft(){if(canLeave())render()}
function isScheduleView(el){return tab==='shift'&&el.tagName==='SELECT'&&['view','period','person'].includes(el.name)}
$('form').addEventListener('input',e=>{if(!isScheduleView(e.target))dirty=true});
$('form').addEventListener('change',e=>{if(!isScheduleView(e.target))dirty=true});
$('form').addEventListener('click',e=>{if(e.target.closest('button[type=button]')&&!e.target.closest('#rulePanel'))dirty=true});
window.addEventListener('beforeunload',e=>{if(dirty||edit>=0||busy||extraBusy){e.preventDefault();e.returnValue=''}});
// Refresh is manual to avoid replacing controls while a user is tapping.
function refreshNow(){if(canLeave())render()}
</script><script src="/extra.js"></script><script src="/payroll-core.js"></script><script src="/payroll.js"></script></body></html>
