services:
  - type: web
    name: seoulbadang
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seoulbadang-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
databases:
  - name: seoulbadang-db
    plan: basic-256mb
